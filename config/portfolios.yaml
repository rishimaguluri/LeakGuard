# Portfolios, management companies and properties.
# Each portfolio belongs to one data mode. The importer only loads portfolios
# for the current mode, and folder names under data/<mode raw dir>/ must match
# the portfolio slug and property codes below.
#
# Everything under mode: demo is fictional.


hash_guest_names: false
default_timezone: America/New_York
cap_rate: 0.08
as_of_date: null
demo_as_of_date: '2026-09-30'
virtual_card_keywords:
- virtual
- vcc
- expedia
- booking
- bcom
- ota
- eva
